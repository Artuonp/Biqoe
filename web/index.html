<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Biqoe App">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="biqoe">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <title>biqoe</title>
  <link rel="manifest" href="manifest.json">
  
  <script src="flutter.js" defer></script>
</head>
<body style="background-color: #F3F7FE; margin: 0; padding: 0;">
  <script>
    window.addEventListener('load', function() {
      // Cargador limpio: SIN Service Worker. 
      // Esto elimina el bug de Android y evita que Safari bloquee la carga.
      _flutter.loader.loadEntrypoint({
        onEntrypointLoaded: function(engineInitializer) {
          // Forzamos HTML para compatibilidad total con móviles
          engineInitializer.initializeEngine({
            renderer: "html"
          }).then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
